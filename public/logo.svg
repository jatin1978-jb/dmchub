<svg width="460" height="120" viewBox="0 0 460 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow: visible;">
  <defs>
    <linearGradient id="hGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E782F"/>
      <stop offset="35%" stop-color="#C5A059"/>
      <stop offset="70%" stop-color="#F9E29C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="hNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B2D"/>
      <stop offset="100%" stop-color="#162B44"/>
    </linearGradient>
    <filter id="hArrowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" floodColor="#D4AF37" floodOpacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Icon Box Mark -->
  <g transform="translate(10, 10)">
    <line x1="8" y1="8" x2="88" y2="8" stroke="url(#hGoldGrad)" stroke-width="4.5"/>
    <line x1="88" y1="8" x2="88" y2="88" stroke="url(#hGoldGrad)" stroke-width="4.5"/>
    <line x1="8" y1="8" x2="8" y2="88" stroke="url(#hGoldGrad)" stroke-width="4.5"/>
    <line x1="8" y1="88" x2="38" y2="88" stroke="url(#hGoldGrad)" stroke-width="4.5"/>
    <line x1="58" y1="88" x2="88" y2="88" stroke="url(#hGoldGrad)" stroke-width="4.5"/>

    {/* Navy Diagonal */}
    <path d="M 16 18 L 38 18 L 38 21 L 16 21 Z" fill="url(#hNavyGrad)"/>
    <path d="M 22 21 L 33 21 L 74 75 L 63 75 Z" fill="url(#hNavyGrad)"/>
    <path d="M 57 75 L 80 75 L 80 78 L 57 78 Z" fill="url(#hNavyGrad)"/>

    {/* Gold Arrow Diagonal with Crossover Gap */}
    <path d="M 16 75 L 32 75 L 32 72 L 16 72 Z" fill="url(#hGoldGrad)"/>
    <path d="M 20 72 L 26 72 L 44 49 L 38 45 Z" fill="url(#hGoldGrad)"/>
    <path d="M 52 38 L 58 42 L 75 20 L 69 16 Z" fill="url(#hGoldGrad)"/>
    <path d="M 66 24 L 88 9 L 74 31 L 70 25 Z" fill="url(#hGoldGrad)" filter="url(#hArrowGlow)"/>
  </g>

  <!-- Right Brand Name & Subtitle -->
  <g transform="translate(118, 52)">
    {/* DMC Text */}
    <text x="0" y="0" font-family="Times New Roman, Georgia, serif" font-size="46" font-weight="bold" fill="#0B1B2D">DMC</text>

    {/* Custom Gold Arrow X in Text */}
    <g transform="translate(116, -37) scale(0.32)">
      <path d="M 10 10 L 36 10 L 90 100 L 64 100 Z" fill="url(#hNavyGrad)"/>
      <path d="M 64 10 L 90 10 L 36 100 L 10 100 Z" fill="url(#hGoldGrad)"/>
      <path d="M 78 22 L 106 4 L 88 32 Z" fill="url(#hGoldGrad)"/>
    </g>

    {/* change Text */}
    <text x="156" y="0" font-family="Times New Roman, Georgia, serif" font-size="46" font-weight="normal" fill="#0B1B2D">change</text>
  </g>

  <!-- Subtitle / Tagline -->
  <g transform="translate(118, 85)">
    <line x1="0" y1="-5" x2="35" y2="-5" stroke="url(#hGoldGrad)" stroke-width="1.2" opacity="0.8"/>
    <text x="43" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2" fill="#0B1B2D">GLOBAL DMC MARKETPLACE</text>
    <line x1="285" y1="-5" x2="320" y2="-5" stroke="url(#hGoldGrad)" stroke-width="1.2" opacity="0.8"/>
  </g>
</svg>
