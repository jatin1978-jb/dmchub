<svg width="260" height="70" viewBox="0 0 260 70" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow: visible;">
  <defs>
    <linearGradient id="logoGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A47E32"/>
      <stop offset="35%" stop-color="#C5A059"/>
      <stop offset="70%" stop-color="#FBE6A3"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="logoNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B2D"/>
      <stop offset="100%" stop-color="#162B44"/>
    </linearGradient>
  </defs>

  <!-- Box Mark (Unclipped) -->
  <g transform="translate(5, 5)">
    {/* Frame lines with bottom gap */}
    <line x1="10" y1="10" x2="55" y2="10" stroke="url(#logoGoldGrad)" stroke-width="3"/>
    <line x1="55" y1="10" x2="55" y2="55" stroke="url(#logoGoldGrad)" stroke-width="3"/>
    <line x1="10" y1="10" x2="10" y2="55" stroke="url(#logoGoldGrad)" stroke-width="3"/>
    <line x1="10" y1="55" x2="24" y2="55" stroke="url(#logoGoldGrad)" stroke-width="3"/>
    <line x1="41" y1="55" x2="55" y2="55" stroke="url(#logoGoldGrad)" stroke-width="3"/>

    {/* Navy Serif Stroke */}
    <path d="M 16 17 L 30 17 L 30 19 L 16 19 Z" fill="url(#logoNavyGrad)"/>
    <path d="M 20 19 L 26 19 L 33 30 L 27 33 Z" fill="url(#logoNavyGrad)"/>
    <path d="M 32 36 L 38 40 L 45 50 L 38 50 Z" fill="url(#logoNavyGrad)"/>
    <path d="M 32 50 L 48 50 L 48 48 L 32 48 Z" fill="url(#logoNavyGrad)"/>

    {/* Gold Arrow Diagonal & Arrow Head */}
    <path d="M 16 50 L 27 50 L 27 48 L 16 48 Z" fill="url(#logoGoldGrad)"/>
    <path d="M 19 48 L 24 48 L 50 18 L 46 14 Z" fill="url(#logoGoldGrad)"/>
    <path d="M 44 21 L 57 12 L 49 26 L 47 21 Z" fill="url(#logoGoldGrad)"/>
  </g>

  <!-- Typography -->
  <text x="72" y="38" font-family="Times New Roman, Georgia, serif" font-size="28" font-weight="bold" fill="#0B1B2D">DMC</text>
  <text x="142" y="38" font-family="Times New Roman, Georgia, serif" font-size="28" font-weight="900" fill="#C5A059">X</text>
  <text x="163" y="38" font-family="Times New Roman, Georgia, serif" font-size="28" font-weight="normal" fill="#0B1B2D">change</text>

  <!-- Subtitle -->
  <line x1="72" y1="48" x2="84" y2="48" stroke="#C5A059" stroke-width="1.2" opacity="0.8"/>
  <text x="88" y="52" font-family="Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#0B1B2D">GLOBAL DMC MARKETPLACE</text>
  <line x1="230" y1="48" x2="242" y2="48" stroke="#C5A059" stroke-width="1.2" opacity="0.8"/>
</svg>
