<svg width="480" height="120" viewBox="0 0 480 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow: visible;">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="micexGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E782F"/>
      <stop offset="35%" stop-color="#C5A059"/>
      <stop offset="70%" stop-color="#F9E29C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Executive Navy Gradient -->
    <linearGradient id="micexNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B2D"/>
      <stop offset="100%" stop-color="#162B44"/>
    </linearGradient>

    <!-- Arrow Soft Glow -->
    <filter id="micexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" floodColor="#D4AF37" floodOpacity="0.5"/>
    </filter>
  </defs>

  <!-- Left Icon Mark: Interlocking MICE Exchange Arrows -->
  <g transform="translate(10, 10)">
    <!-- Outer Gold Frame Corners -->
    <path d="M 8 8 L 44 8 M 56 8 L 92 8 M 92 8 L 92 44 M 92 56 L 92 92 M 92 92 L 56 92 M 44 92 L 8 92 M 8 92 L 8 56 M 8 44 L 8 8" stroke="url(#micexGoldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Diagonal Navy Bar -->
    <path d="M 22 24 L 38 24 L 78 76 L 62 76 Z" fill="url(#micexNavyGrad)"/>

    <!-- Right Diagonal Gold Arrow Bar -->
    <path d="M 78 24 L 62 24 L 22 76 L 38 76 Z" fill="url(#micexGoldGrad)"/>
    
    <!-- Top-Right Arrow Head -->
    <path d="M 68 20 L 90 10 L 80 32 Z" fill="url(#micexGoldGrad)" filter="url(#micexGlow)"/>
    
    <!-- Bottom-Left Arrow Head -->
    <path d="M 32 80 L 10 90 L 20 68 Z" fill="url(#micexNavyGrad)"/>
  </g>

  <!-- Brand Typography: MICEXchange -->
  <g transform="translate(122, 60)">
    <!-- MICE Bold Navy Text -->
    <text x="0" y="0" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="#0B1B2D">MICE</text>

    <!-- Xchange Gold Text -->
    <text x="118" y="0" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="400" letter-spacing="-0.5" fill="url(#micexGoldGrad)">Xchange</text>
  </g>

  <!-- Tagline / Subtitle -->
  <g transform="translate(122, 92)">
    <line x1="0" y1="-5" x2="30" y2="-5" stroke="url(#micexGoldGrad)" stroke-width="1.5" opacity="0.8"/>
    <text x="38" y="0" font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="3.2" fill="#0B1B2D">MICE &amp; CONGRESS ACCOMMODATION</text>
    <line x1="318" y1="-5" x2="348" y2="-5" stroke="url(#micexGoldGrad)" stroke-width="1.5" opacity="0.8"/>
  </g>
</svg>
