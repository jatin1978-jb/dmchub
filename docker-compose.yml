version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dmchub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dmchub
    ports:
      - "5432:5432"
    volumes:
      - dmchub_pgdata:/var/lib/postgresql/data

volumes:
  dmchub_pgdata:
